{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SPACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: rgba(18, 18, 22, 0.75);
      --surface-border: rgba(255, 255, 255, 0.12);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.35);
      --text: #f4f4f5;
      --text-dim: #71717a;
      --danger: #ef4444;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glows */
    .bg-glow-1 {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
      top: -150px;
      left: -150px;
      pointer-events: none;
    }

    .bg-glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: -150px;
      right: -150px;
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      z-index: 10;
    }

    .login-card {
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-dim);
    }

    .notice-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.25);
      color: #c4b5fd;
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 24px;
      width: 100%;
      justify-content: center;
      font-family: var(--font-mono);
    }

    .error-alert {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-input {
      width: 100%;
      background: rgba(14, 14, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s;
      margin-top: 8px;
    }

    .btn-submit:hover {
      opacity: 0.95;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-logo">S P A C E</div>
        <div class="brand-subtitle">Infinite Workspace Engine</div>
      </div>

      <div class="notice-badge">
        🔒 Private Instance — Registration Closed
      </div>

      {% if error %}
        <div class="error-alert">
          {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Enter username" required autofocus />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required />
        </div>

        <button type="submit" class="btn-submit">Sign In to Space</button>
      </form>

      <div class="footer-note">
        Protected Workspace &bull; v2.0
      </div>
    </div>
  </div>
</body>
</html>
